name: Weekly dependency check

# requirements.txt / requirements-data.txt の週次点検。**PRの必須ゲートにはしない**
# (pull_request トリガを付けない)。external-links.yml と同じ設計方針で、依存の
# 一時的な事情でPRのマージがブロックされることを避けるため。
#
# ジョブを3本に分けている(1本にまとめない):
#   - pip-audit は「既知脆弱性の検知」がジョブの役目そのものなので、新しい脆弱性が
#     公表された週に赤くなる(それが検知の成功)。continue-on-error にはしない。
#   - install-test-linux / install-test-windows-arm は「クリーンインストールできるか」
#     という別の観点の試験。pip-audit の赤がこの試験の結果を覆い隠さないように、
#     ジョブを分けて独立に緑/赤を見られるようにしている。
on:
  schedule:
    # 毎週火曜 03:41 UTC(= 火曜 12:41 JST)。external-links.yml が月曜 00:17 UTC を
    # 使っているため曜日をずらす。分を0にしないのは同ファイルと同じ理由で、
    # GitHub Actions のスケジュールは毎時0分に集中して遅延しやすいため。
    - cron: "41 3 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # requirements.txt と requirements-data.txt の既知脆弱性を pip-audit で見る。
  #
  # 通常は緑(両ファイルとも既知脆弱性0件)。赤になったら、固定している版に新しい
  # 脆弱性が公表されたということなので、ログの Fix Versions を見て版を上げる。
  # requirements-data.txt の cryptography は Windows ARM64 限定で既知脆弱性のある
  # 46.0.3 に固定しているが(理由は requirements-data.txt のコメント)、このジョブは
  # ubuntu-latest で走るので環境マーカーが偽になり、その固定は検査対象に入らない。
  #
  # continue-on-error は付けない。赤になることが検知の役目そのものだから
  # (付けてしまうと、脆弱性が増えても週次ワークフローが常に緑のままになり
  # 気づけなくなる)。
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install pip-audit

      - run: pip-audit -r requirements.txt

      # if: always() が要る。既定では前のステップが赤いとここは実行されないため、
      # requirements.txt 側に脆弱性が出た週は requirements-data.txt 側が
      # 「検査されなかった」まま隠れてしまう(ジョブを3本に分けたのと同じ理由で、
      # 一方の赤が他方の結果を覆い隠さないようにする)。
      - if: always()
        run: pip-audit -r requirements-data.txt

  # requirements-data.txt のクリーンインストール試験(Linux)。まっさらな venv に
  # インストールし、インストールが通っただけでなく実際に import できることまで見る
  # (インストールだけ通って import で落ちる、というケースを取りこぼさないため)。
  install-test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: python -m venv .venv

      - run: .venv/bin/pip install -r requirements-data.txt

      - run: .venv/bin/python -c "import pandas, requests, openpyxl, pdfplumber"

  # 同じ導入試験を Windows ARM64 で行う。開発機が Windows ARM64 であり、
  # cryptography(pdfplumber → pdfminer.six の推移的依存)は 46.0.4 以降 win_arm64 の
  # wheel を配布していない。requirements-data.txt が Windows ARM64 限定で 46.0.3 に
  # 固定してインストールを通しているので(issue #45)、その固定が効き続けているかを
  # 同じ環境で継続的に見る。
  install-test-windows-arm:
    runs-on: windows-11-arm
    # このジョブは失敗しても週次ワークフロー全体を赤にしない(オーナー判断で据え置き)。
    # 導入当初の理由(issue #45 の既知の失敗、windows-11-arm ラベルが使えるか未確認)は
    # どちらも解消しており、2026-08-25〜09-29 の8回はすべて成功している。
    # 全体が緑でもこのジョブだけ失敗していることがあるので、結果はジョブ単位で見ること。
    continue-on-error: true
    # cryptography に win_arm64 wheel が無い場合、pip はソースビルド(Rust)に落ちる。
    # 失敗するにせよ成功するにせよ長時間ランナーを占有しうるので上限を切っておく。
    timeout-minutes: 30
    env:
      # Windows では requirements-data.txt の日本語コメントを pip が既定の
      # ロケール(cp932)で読もうとして UnicodeDecodeError になる(CLAUDE.md の
      # 既知の罠)。しかも pip が終了コード0を返すことがあり、気づかずに
      # 進んでしまう。PYTHONUTF8=1 で pip の読み込みを UTF-8 に固定する。
      PYTHONUTF8: 1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: python -m venv .venv

      # Windows のシェルは既定で PowerShell。venv のパスは Linux と違い
      # .venv\Scripts\ 以下になる。
      - run: .venv\Scripts\pip.exe install -r requirements-data.txt

      - run: .venv\Scripts\python.exe -c "import pandas, requests, openpyxl, pdfplumber"
